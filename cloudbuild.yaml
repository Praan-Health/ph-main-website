# On every push to main: run the unit tests, build the site for the domain root and deploy it to Firebase Hosting
# (site praan-health-site, see firebase.json). Forms post to /api/forms on the same domain, which Hosting rewrites to
# the ph-website-forms Cloud Run service; leads also go straight from the browser to the n8n webhook set below.
steps:
  - id: install
    name: node:20
    entrypoint: npm
    args: ['ci']

  - id: test
    name: node:20
    entrypoint: npm
    args: ['test']

  - id: build
    name: node:20
    entrypoint: npm
    args: ['run', 'build']
    env:
      - 'VITE_BASE=/'
      - 'VITE_FORMS_ENDPOINT=/api/forms'
      - 'VITE_N8N_WEBHOOK_URL=https://praan.app.n8n.cloud/webhook/incoming-leads'

  - id: deploy
    name: node:20
    entrypoint: npx
    args: ['--yes', 'firebase-tools@15', 'deploy', '--only', 'hosting', '--project', '$PROJECT_ID', '--non-interactive']

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
