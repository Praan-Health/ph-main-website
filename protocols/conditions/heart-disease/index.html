    <script type="application/ld+json">{"@context":"https://schema.org","@type":"MedicalWebPage","name":"Heart Disease","description":"Strengthen overall cardiovascular function and reduce long-term risk through structured, evidence-based care.","url":"https://praan.health/protocols/conditions/heart-disease/","datePublished":"2026-05-21T13:28:17.712Z","dateModified":"2026-05-21T13:12:44.256Z","about":{"@type":"MedicalCondition","name":"Heart Disease","description":"Strengthen overall cardiovascular function and reduce long-term risk through structured, evidence-based care."},"mainEntity":{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Early signs to notice","acceptedAnswer":{"@type":"Answer","text":"- Chest discomfort, pressure, or heaviness during activity or stress - Shortness of breath that feels out of proportion to exertion - Unusual fatigue during routine daily tasks - Discomfort radiating to the left arm, jaw, or upper back - Irregular or noticeably fast heartbeats (palpitations) - Dizziness or light-headed episodes during exertion - Reduced exercise tolerance compared to earlier levels ‍"}},{"@type":"Question","name":"Why it happens","acceptedAnswer":{"@type":"Answer","text":"Heart disease usually develops when the blood vessels supplying the heart gradually become narrowed or blocked due to plaque buildup (fat, cholesterol, and other substances). This reduces blood flow to the heart muscle over time. When the heart doesn’t receive enough oxygen-rich blood, it starts working harder, which can eventually weaken its function or trigger acute events like heart attacks. This process is driven by long-term factors such as high blood pressure, high cholesterol, diabetes, smoking, inactivity, chronic stress, and genetic predisposition. ‍"}},{"@type":"Question","name":"Common contributing factors","acceptedAnswer":{"@type":"Answer","text":"- High blood pressure and high cholesterol - Diabetes or insulin resistance - Smoking and tobacco exposure - Sedentary lifestyle and low fitness levels - Excess abdominal weight or obesity - Chronic stress and poor sleep quality - Family history of cardiovascular disease - Diet high in processed foods, salt, and unhealthy fats ‍"}},{"@type":"Question","name":"If not managed well","acceptedAnswer":{"@type":"Answer","text":"Over time, heart disease can impact several vital systems, including: - Chest pain, breathlessness, and reduced exercise capacity - Increased risk of heart attack or heart failure - Irregular heart rhythms and cardiovascular instability - Reduced blood flow affecting brain and kidney function - Fatigue and reduced daily functional ability - Gradual decline in overall physical stamina ‍"}},{"@type":"Question","name":"Who should pay closer attention","acceptedAnswer":{"@type":"Answer","text":"- People with diabetes, high blood pressure, or high cholesterol - Those with low stamina, breathlessness, or reduced exercise capacity - Individuals with family history of heart disease or early cardiac events - People with smoking habits, chronic stress, or sedentary lifestyle - Individuals with abdominal obesity or metabolic imbalance"}}]},"provider":{"@type":"MedicalOrganization","name":"Praan Health","url":"https://praan.health"}}</script>
